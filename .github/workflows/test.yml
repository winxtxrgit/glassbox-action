name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The composite action's audit step needs a real model (a secret key or a
  # self-hosted Ollama), so this smoke test verifies the part that can run on a
  # hosted runner with no secrets: that glassbox installs exactly as the action
  # does (from PyPI by default, or from a git ref), and the CLI works.
  # Keep the PyPI version here in step with the `glassbox-version` default in
  # action.yml.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source:
          - pypi
          - git-main
          - git-v0.7.0 # a tag from before the PyPI rename
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install glassbox the way the action does
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          case "$SOURCE" in
            pypi) pip install "glassbox-audit==0.8.0" ;;
            git-*) pip install "git+https://github.com/winxtxrgit/glassbox@${SOURCE#git-}" ;;
          esac
      - name: CLI runs
        run: |
          glassbox --version
          glassbox demo
          glassbox audit --demo || test $? -eq 1
          glassbox audit --demo --json > audit.json || test $? -eq 1
          python -c "import json; json.load(open('audit.json'))"

  # Runs the action itself with inputs that would execute as shell code if they
  # were pasted into the script. There's no model here, so the audit is expected
  # to fail; the check is that the marker files never get created.
  injection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the action with hostile inputs
        id: run
        continue-on-error: true
        uses: ./
        with:
          file: "doc$(touch /tmp/pwned-file).txt"
          model: "x$(touch /tmp/pwned-model)"
      - name: Inputs were not executed
        run: |
          test ! -e /tmp/pwned-file
          test ! -e /tmp/pwned-model
          echo "trustworthy=${{ steps.run.outputs.trustworthy }}"
