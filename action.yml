name: "Glassbox Audit"
description: "Audit an LLM verdict for faithfulness — catch hallucinated evidence in CI."
author: "Thanut Jongteerathanachote"
branding:
  icon: "search"
  color: "purple"

inputs:
  file:
    description: "Path to the document to audit."
    required: true
  backend:
    description: "Where the model runs: ollama | openrouter | groq."
    required: false
    default: "openrouter"
  model:
    description: "Model name (e.g. qwen2.5:3b). Empty = the backend's default."
    required: false
    default: ""
  glassbox-version:
    description: "glassbox-audit version to install from PyPI. Pinned to a tested release so a new glassbox release can't break your CI."
    required: false
    default: "0.8.0"
  glassbox-ref:
    description: "Install glassbox from this git ref (tag, branch or commit SHA) instead of PyPI, e.g. main. Empty = use glassbox-version."
    required: false
    default: ""
  python-version:
    description: "Python version to set up."
    required: false
    default: "3.12"

outputs:
  trustworthy:
    description: "true if the verdict passed grounding + faithfulness + consistency."
    value: ${{ steps.audit.outputs.trustworthy }}
  report:
    description: "The full JSON audit report."
    value: ${{ steps.audit.outputs.report }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install glassbox
      shell: bash
      # On PyPI glassbox is "glassbox-audit" ("glassbox" there is an unrelated
      # project). Inputs go through env so they're never parsed as shell code.
      env:
        GLASSBOX_VERSION: ${{ inputs.glassbox-version }}
        GLASSBOX_REF: ${{ inputs.glassbox-ref }}
      run: |
        if [ -n "$GLASSBOX_REF" ]; then
          # No package name in the URL: tags before v0.8.0 are named "glassbox".
          pip install "git+https://github.com/winxtxrgit/glassbox@$GLASSBOX_REF"
        else
          pip install "glassbox-audit==$GLASSBOX_VERSION"
        fi

    - name: Audit
      id: audit
      shell: bash
      run: |
        set +e
        model_arg=""
        if [ -n "${{ inputs.model }}" ]; then model_arg="--model ${{ inputs.model }}"; fi
        report=$(glassbox audit "${{ inputs.file }}" --backend "${{ inputs.backend }}" $model_arg --json)
        code=$?
        {
          echo "report<<GLASSBOX_EOF"
          echo "$report"
          echo "GLASSBOX_EOF"
        } >> "$GITHUB_OUTPUT"
        trust=$(echo "$report" | python -c "import sys,json; print(str(json.load(sys.stdin).get('trustworthy', False)).lower())" 2>/dev/null || echo "false")
        echo "trustworthy=$trust" >> "$GITHUB_OUTPUT"
        exit $code
